sourceSets.main.java.srcDirs = [ "src/" ]
sourceSets.main.resources.srcDirs = ["../assets"]

project.ext.mainClassName = "com.steel.silent.DesktopLauncher"
project.ext.assetsDir = new File("../assets")

import org.gradle.internal.os.OperatingSystem

tasks.register('run', JavaExec) {
    dependsOn classes
    mainClass.set(project.mainClassName)
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true

    // Ensure macOS always starts JVM on the first thread (required by GLFW/LWJGL)
    if (OperatingSystem.current() == OperatingSystem.MAC_OS || System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += "-XstartOnFirstThread"
    }
}

tasks.register('debug', JavaExec) {
    dependsOn classes
    mainClass.set(project.mainClassName)
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
    if (OperatingSystem.current() == OperatingSystem.MAC_OS || System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs += "-XstartOnFirstThread"
    }
}

tasks.register('dist', Jar) {
    dependsOn classes, configurations.runtimeClasspath
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

eclipse.project.name = appName + "-desktop"
